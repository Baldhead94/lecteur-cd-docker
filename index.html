<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecteur CD Web</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif}body{margin:0;background:#10131a;color:#f2f4f7;display:grid;place-items:center;min-height:100vh}.player{width:min(94vw,480px);background:#1d2430;border:1px solid #414b5c;border-radius:24px;padding:26px;box-shadow:0 20px 70px #0007}h1{margin:0 0 12px;font-size:25px}.sub{color:#9db0cb;font-size:13px}.screen{background:#101b20;border:1px solid #3b5456;border-radius:14px;padding:17px;margin:20px 0;color:#a7f1cf;min-height:90px}.screen strong{display:block;font-size:20px;margin:7px 0}.time{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}button{border:0;border-radius:12px;background:#39475b;color:white;cursor:pointer;font-size:20px;padding:14px}button:hover{background:#526780}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.tools button{font-size:14px;flex:1;padding:11px 8px}.tools .eject{background:#805632}select{width:100%;background:#121923;color:white;border:1px solid #414b5c;border-radius:8px;padding:12px;margin:14px 0}#status{margin-top:12px;min-height:20px;font-size:13px;color:#c1c9d7}progress{width:100%;height:9px;accent-color:#a7f1cf}footer{margin-top:18px;text-align:right;color:#8693a7;font-size:12px}</style></head><body><div class="player"><h1>💿 Lecteur CD</h1><div class="sub" id="album">OptiPlex · lecteur réseau</div><div class="screen"><div id="tracklabel">Insère un CD audio</div><strong id="title">Prêt</strong><progress id="progress" max="100" value="0"></progress><div class="time"><span id="elapsed">00:00</span><span id="remaining">−00:00</span></div></div><div class="controls"><button title="Piste précédente" id="prev">⏮</button><button title="Lire" id="play">▶</button><button title="Pause" id="pause">⏸</button><button title="Piste suivante" id="next">⏭</button><button title="Arrêt" id="stop">⏹</button></div><select id="list"><option>Recherche du disque…</option></select><div class="tools"><button id="refresh">↻ Actualiser</button><button id="eject" class="eject">⏏ Éjecter</button><button id="close">⤓ Fermer</button></div><div id="status" role="status"></div><footer>Lecteur CD Web · Docker</footer><audio id="audio" preload="none"></audio></div><script>
const $=id=>document.getElementById(id),audio=$('audio');let disc=[],idx=0,started=false;
function fmt(v){v=Math.max(0,Math.floor(v||0));return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function info(s){$('status').textContent=s}
function display(){let t=disc[idx];$('tracklabel').textContent=t?'Piste '+t.number+' / '+disc.length:'Aucun disque';$('title').textContent=t?t.title:'Insère un CD audio';$('list').value=String(idx);clock()}
function clock(){let dur=disc[idx]?.duration||0,e=audio.currentTime||0;$('elapsed').textContent=fmt(e);$('remaining').textContent='−'+fmt(dur-e);$('progress').value=dur?100*e/dur:0}
async function load(){info('Lecture de la table des pistes…');try{let r=await fetch('/api/metadata',{cache:'no-store'}),d=await r.json();disc=d.tracks||[];idx=0;started=false;audio.pause();audio.removeAttribute('src');audio.load();$('album').textContent=[d.artist,d.album].filter(Boolean).join(' — ')||'OptiPlex · lecteur réseau';$('list').innerHTML='';disc.forEach((t,i)=>{let o=document.createElement('option');o.value=i;o.textContent=String(t.number).padStart(2,'0')+' · '+t.title+' ('+fmt(t.duration)+')';$('list').appendChild(o)});display();info(disc.length?disc.length+' pistes disponibles':d.error||'Aucun CD audio')}catch(e){info('Erreur : '+e.message)}}
async function play(){if(!disc.length)return info('Insère un CD audio puis actualise');if(!started){audio.src='/stream?track='+disc[idx].number+'&v='+Date.now();started=true}try{await audio.play();info('Lecture en cours')}catch(e){info('Lecture impossible : '+e.message)}}
function change(i){if(!disc.length)return;const wasPlaying=!audio.paused;audio.pause();idx=(i+disc.length)%disc.length;started=false;audio.removeAttribute('src');audio.load();display();if(wasPlaying)play()}
async function stop(){audio.pause();started=false;audio.removeAttribute('src');audio.load();clock();try{await fetch('/api/stop',{method:'POST'})}catch(e){}info('Arrêt')}
async function action(endpoint){await stop();try{let r=await fetch(endpoint,{method:'POST'}),d=await r.json();info(d.message|| (d.ok?'Terminé':'Échec'));if(endpoint==='/api/eject')disc=[];display()}catch(e){info(e.message)}}
$('play').onclick=play;$('pause').onclick=()=>{audio.pause();info('Pause')};$('prev').onclick=()=>change(idx-1);$('next').onclick=()=>change(idx+1);$('stop').onclick=stop;$('refresh').onclick=load;$('eject').onclick=()=>action('/api/eject');$('close').onclick=()=>action('/api/close');$('list').onchange=e=>change(Number(e.target.value));audio.ontimeupdate=clock;audio.onended=()=>{if(idx<disc.length-1){change(idx+1);play()}else stop()};audio.onerror=()=>info('Erreur de lecture ou disque absent');load();
</script></body></html>
